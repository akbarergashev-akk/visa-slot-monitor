name: Visa calendar change notification (manual test)

# Manual validation only. No schedule until explicit site permission and stable results.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visa-calendar-change-single
  cancel-in-progress: false

jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install -r visa_slot_monitor_free/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify category and calendar; notify only about change
        run: python visa_slot_monitor_free/calendar_change_watcher.py
      - name: Save safe change checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visa_slot_monitor_free/calendar_marker_checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Save calendar marker check [skip ci]"
            git push
          fi
