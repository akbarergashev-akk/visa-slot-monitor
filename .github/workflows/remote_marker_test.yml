name: One-time remote calendar marker audit

# Manual-only validation. No schedule, booking, or CAPTCHA bypass.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marker-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Read calendar markers once
        run: python visa_slot_monitor_free/remote_marker_preflight.py
