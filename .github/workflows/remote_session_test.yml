name: One-time remote calendar session test

# Manual test only. No schedule, no booking, no CAPTCHA bypass.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Verify isolated session on a single calendar page
        run: python visa_slot_monitor_free/remote_session_preflight.py
