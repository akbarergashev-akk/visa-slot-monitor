name: Visa calendar Tashkent 06-12 schedule

# Seven daily windows: 06:00/02/04 through 12:00/02/04, Tashkent time.
# Warm GitHub runner five minutes early. GitHub scheduling is best-effort.
on:
  schedule:
    - cron: '55 5 * * *'
      timezone: 'Asia/Tashkent'
    - cron: '55 6 * * *'
      timezone: 'Asia/Tashkent'
    - cron: '55 7 * * *'
      timezone: 'Asia/Tashkent'
    - cron: '55 8 * * *'
      timezone: 'Asia/Tashkent'
    - cron: '55 9 * * *'
      timezone: 'Asia/Tashkent'
    - cron: '55 10 * * *'
      timezone: 'Asia/Tashkent'
    - cron: '55 11 * * *'
      timezone: 'Asia/Tashkent'
  workflow_dispatch:
    inputs:
      reset_after_session_update:
        description: 'Only after updating AUTH_STATE_B64: clear login pause and test once'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: visa-calendar-change-single
  cancel-in-progress: false

jobs:
  read-only-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pause flag without contacting embassy
        id: status
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python -c "import json; print(json.load(open('visa_slot_monitor_free/calendar_schedule_status.json'))['auth_paused'])" | grep -q True; then
            echo 'AUTH PAUSED: Site will not be contacted until session is refreshed.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Python and browser for unpaused checks
        if: steps.status.outputs.skip != 'true'
        run: |
          python -m pip install -r visa_slot_monitor_free/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check at Tashkent :00, :02 and :04
        if: steps.status.outputs.skip != 'true'
        run: python visa_slot_monitor_free/calendar_schedule_runner.py
      - name: Save non-sensitive calendar status and checkpoint
        if: always() && steps.status.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visa_slot_monitor_free/calendar_schedule_status.json
          if [ -f visa_slot_monitor_free/calendar_marker_checkpoint.json ]; then
            git add visa_slot_monitor_free/calendar_marker_checkpoint.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Save scheduled calendar state [skip ci]"
            git push
          fi
